<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2eee3">
<title>ساختمان داده‌ها | گروه‌بندی تمرین دوم</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<style>
@font-face{font-family:"IRANYekanX";src:url("fonts/x ایران یکان/IRANYekanX Pro/Variable Font/webfont/IRANYekanXVF.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Peyda";src:url("fonts/پیدا/PeydaWeb/woff2/PeydaWeb-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Peyda";src:url("fonts/پیدا/PeydaWeb/woff2/PeydaWeb-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Peyda";src:url("fonts/پیدا/PeydaWeb/woff2/PeydaWeb-Black.woff2") format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Kenaar";src:url("fonts/کنار/04- Kenaar Variable/Variable WebFont/KenaarGX.woff2") format("woff2");font-weight:100 900;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
.skip{position:absolute;inset-inline-start:8px;top:-70px;z-index:9999;background:#fff;color:#000;padding:10px 14px;border:3px solid #000;font:800 14px 'IRANYekanX',Tahoma,sans-serif}
.skip:focus{top:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:root{--paper:#f2eee3;--ink:#121212;--white:#fffdf7;--blue:#2677C9;--red:#D93636;--yellow:#F5C518;--green:#27834A;--pink:#D94E9A;--black:#292929;--taA:#1b5fb4;--taB:#c42d1f}
body{font-family:'IRANYekanX','Peyda',Tahoma,sans-serif;background:var(--paper);color:var(--ink);line-height:1.8;overflow-x:hidden}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(12px,env(safe-area-inset-top)) clamp(14px,4vw,48px) 12px;border-bottom:4px solid var(--ink);background:var(--white);position:relative;z-index:5}
.bar b{display:flex;align-items:center;gap:12px;font:900 clamp(16px,2vw,20px) 'Kenaar','Peyda',sans-serif}
.bar b img{width:34px;height:34px;object-fit:contain}
.bar b i{display:inline-block;width:26px;height:26px;background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%);border-radius:50% 0 50% 0}
.back{display:inline-flex;align-items:center;gap:8px;padding:5px 18px;background:var(--yellow);color:var(--ink);text-decoration:none;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font:900 14px 'Peyda','IRANYekanX',sans-serif;transition:transform .15s,box-shadow .15s,background .15s}
.back:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);background:var(--white)}
.poster{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:min(88svh,800px);border-bottom:4px solid var(--ink);overflow:hidden;isolation:isolate;background:var(--paper)}
.geo{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.sh{transform-box:fill-box;transform-origin:center;transform:translate(calc(var(--px,0)*var(--d,0)*1px),calc(var(--py,0)*var(--d,0)*1px)) rotate(calc(var(--sr,0)*var(--rk,0)*1deg));transition:transform .3s ease-out;animation:fly 1.1s cubic-bezier(.2,1,.3,1) backwards;animation-delay:var(--t,0s)}
@keyframes fly{from{opacity:0;translate:var(--fx,0) var(--fy,0);rotate:var(--fr,0deg);scale:.35}}
.poster-text{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(22px,5vw,72px)}
h1{margin:0;font:900 clamp(64px,13.5vw,214px)/.86 'Kenaar','Peyda','IRANYekanX',sans-serif;letter-spacing:-.025em}
h1 span{display:block}
h1 span+span{margin-inline-start:.3em;color:transparent;-webkit-text-stroke:clamp(2px,.34vw,5px) var(--ink)}
.meta{margin:26px 0 0;max-width:430px;font:800 clamp(15px,1.7vw,21px)/1.8 'Peyda','IRANYekanX',sans-serif;border-top:6px solid var(--ink);padding-top:12px}
.meta em{font-style:normal;background:var(--ink);color:var(--yellow);padding:0 10px}
.ticker{background:var(--ink);color:var(--yellow);overflow:hidden;white-space:nowrap;border-bottom:4px solid var(--ink);direction:ltr}
.ticker div{display:inline-flex;padding:10px 0;animation:tick var(--dur,30s) linear infinite;will-change:transform;font:900 22px 'Kenaar','Peyda',sans-serif;direction:ltr}
.ticker span{display:inline-flex;align-items:center;gap:30px;padding-inline-end:30px}
.ticker i{width:18px;height:18px;background:var(--red);display:inline-block;border-radius:50%}
.ticker span:nth-child(3n+2) i{background:var(--blue);border-radius:0}
.ticker span:nth-child(3n) i{background:var(--yellow);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
@keyframes tick{to{transform:translateX(-50%)}}
.pal{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-bottom:4px solid var(--ink);background:var(--white)}
.pal button{border:0;border-inline-end:4px solid var(--ink);background:var(--c);color:var(--cf);padding:14px 4px 10px;font:900 clamp(22px,3.4vw,44px)/1 'Kenaar','Peyda',sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;transition:padding .2s cubic-bezier(.2,1.6,.4,1),filter .2s}
.pal button:last-child{border-inline-end:0}
.pal button small{font:800 12px 'Peyda',sans-serif;opacity:.9}
.pal button:hover,.pal button:focus-visible{padding-top:26px;padding-bottom:0}
.tools{display:flex;align-items:stretch;border-bottom:4px solid var(--ink);background:var(--white)}
.tools label{flex:1;display:flex;align-items:center;gap:14px;padding:0 clamp(14px,4vw,48px);min-width:0;transition:background .2s}
.tools label::before{content:"";flex:none;width:22px;height:22px;background:var(--red);border-radius:50%}
.tools input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:22px 0;font:800 clamp(18px,2.4vw,28px) 'Peyda','IRANYekanX',sans-serif}
.tools input::placeholder{color:var(--ink);opacity:.35}
.tools label:focus-within{background:var(--yellow)}
.count{display:grid;place-items:center;padding:0 clamp(14px,3vw,40px);background:var(--blue);color:var(--white);font:900 clamp(14px,1.7vw,20px) 'Peyda',sans-serif;border-inline-start:4px solid var(--ink);white-space:nowrap}
.count.bump{animation:bump .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.08)}}
#groups{display:flex;flex-direction:column;padding-bottom:6px;background:var(--paper)}
.band{--k:0;position:relative;display:grid;grid-template-columns:minmax(170px,23%) minmax(0,31%) minmax(0,1fr);background:var(--bg);color:var(--fg);border-bottom:4px solid var(--ink);min-height:320px}
.g0{--bg:var(--blue);--fg:#fffdf7;--s1:#F5C518;--s2:#D93636;--mkb:#fffdf7;--mkf:#2677C9;--ln:rgba(255,253,247,.55);--sh:circle}
.g1{--bg:var(--red);--fg:#fffdf7;--s1:#121212;--s2:#F5C518;--mkb:#fffdf7;--mkf:#D93636;--ln:rgba(255,253,247,.55)}
.g2{--bg:var(--yellow);--fg:#121212;--s1:#2677C9;--s2:#D93636;--mkb:#121212;--mkf:#F5C518;--ln:rgba(18,18,18,.6)}
.g3{--bg:var(--green);--fg:#fffdf7;--s1:#F5C518;--s2:#D94E9A;--mkb:#fffdf7;--mkf:#27834A;--ln:rgba(255,253,247,.55)}
.g4{--bg:var(--pink);--fg:#fffdf7;--s1:#121212;--s2:#F5C518;--mkb:#fffdf7;--mkf:#D94E9A;--ln:rgba(255,253,247,.6)}
.g5{--bg:var(--black);--fg:#f5f1e8;--s1:#F5C518;--s2:#f5f1e8;--mkb:#f5f1e8;--mkf:#292929;--ln:rgba(245,241,232,.5)}
.b-shape{position:relative;overflow:hidden;border-inline-end:4px solid var(--ink);display:grid;place-items:center;padding:22px}
.shape{width:min(100%,210px);aspect-ratio:1;transform:rotate(var(--rot,0deg));transition:scale .45s cubic-bezier(.2,1.5,.4,1)}
.band:hover .shape{scale:1.1}
.b-num{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(96px,13vw,200px)/1 'Kenaar','Peyda',sans-serif;color:var(--bg);pointer-events:none;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.b-info{padding:clamp(18px,2.6vw,36px);border-inline-end:4px solid var(--ink);display:flex;flex-direction:column;gap:20px;justify-content:space-between}
h2{margin:0;font:900 clamp(40px,5vw,72px)/1 'Kenaar','Peyda','IRANYekanX',sans-serif}
.tas{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin:0;padding:0;list-style:none}
.tas li{display:inline-flex;align-items:center;gap:10px;background:var(--white);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:2px 14px 2px 10px;font:900 clamp(14px,1.45vw,17px) 'Peyda','IRANYekanX',sans-serif;transition:transform .2s cubic-bezier(.2,1.7,.4,1);color:var(--c)}
.tas li::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--c);flex:none}
.tas li.a{--c:var(--taA)}
.tas li.b{--c:var(--taB)}
.tas li.b::before{border-radius:0}
.tas li:hover{transform:translate(-3px,-3px) rotate(-1.5deg)}
.g5 .tas li{border-color:#f5f1e8;box-shadow:4px 4px 0 var(--yellow)}
.cnt{margin:0;font:900 15px 'Peyda',sans-serif}
.cnt b{display:inline-block;background:var(--fg);color:var(--bg);padding:0 12px}
.b-roster{margin:0;padding:clamp(16px,2.4vw,34px);list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:0 28px;align-content:start;counter-reset:n}
.b-roster li{counter-increment:n;display:flex;align-items:baseline;gap:10px;padding:7px 8px;border-bottom:2px solid var(--ln);font:800 clamp(15px,1.4vw,18px)/1.7 'IRANYekanX','Peyda',sans-serif;background:linear-gradient(var(--fg),var(--fg)) no-repeat right/0% 100%;transition:background-size .3s cubic-bezier(.2,.8,.2,1),color .2s}
.b-roster li::before{content:counter(n,persian);font:900 13px 'Peyda',sans-serif;min-width:22px;opacity:.85}
.b-roster li:hover{background-size:100% 100%;color:var(--bg)}
mark{background:var(--mkb);color:var(--mkf);padding:0 4px}
.empty{padding:60px 20px;text-align:center;font:900 28px 'Kenaar','Peyda',sans-serif;border-bottom:4px solid var(--ink);background:var(--yellow)}
.foot{display:flex;justify-content:flex-end;gap:14px;flex-wrap:wrap;padding:20px clamp(14px,4vw,48px) max(20px,env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);font:700 14px 'Peyda',sans-serif}
@media(min-width:1000px){
  .band{position:sticky;top:calc(var(--sticky,0px) + var(--k)*14px);box-shadow:0 -4px 0 var(--ink)}
}
.sb,.cu,#fx{display:none}
@media(min-width:900px) and (hover:hover) and (pointer:fine){
  html.js-sb{scrollbar-width:none}
  html.js-sb::-webkit-scrollbar{display:none}
  html.js-sb .sb{display:block;position:fixed;left:6px;top:12px;bottom:12px;width:30px;z-index:99990;touch-action:none;user-select:none;-webkit-user-select:none}
  .sb-line{position:absolute;left:50%;top:0;bottom:0;width:2px;translate:-50% 0;background:var(--ink)}
  .sb-ticks{position:absolute;left:50%;top:0;bottom:0;width:20px;translate:-50% 0;background:repeating-linear-gradient(180deg,var(--ink) 0 2px,transparent 2px 16px)}
  .sb-thumb{position:absolute;left:50%;top:0;width:22px;height:var(--th,80px);translate:-50% 0;transform:translateY(var(--ty,0px));background:var(--tc,var(--yellow));border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:background .35s;touch-action:none}
  .sb-thumb::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--ink);translate:-50% -50%}
  .sb.drag .sb-thumb{box-shadow:1px 1px 0 var(--ink)}
  .sb-tip{position:absolute;left:38px;top:0;transform:translateY(calc(var(--ty,0px) + var(--th,80px)/2 - 50%));background:var(--ink);color:var(--yellow);font:900 13px 'Peyda',sans-serif;padding:1px 12px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .2s}
  .sb:hover .sb-tip,.sb.drag .sb-tip{opacity:1}
  body.cu-on,body.cu-on *{cursor:none!important}
  body.cu-on.cu-native,body.cu-on.cu-native *{cursor:text!important}
  .cu{display:block;position:fixed;left:0;top:0;z-index:100001;pointer-events:none;mix-blend-mode:difference;opacity:0;transition:opacity .2s}
  body.cu-on .cu{opacity:1}
  body.cu-on.cu-native .cu{opacity:0}
  .cu .w{position:absolute;left:0;top:0;width:0;height:0;display:block;will-change:transform}
  .cu-ring,.cu-dot,.cu-tri{position:absolute;left:0;top:0;display:block}
  .cu-dot{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;transition:scale .25s cubic-bezier(.2,1.6,.4,1)}
  .cu-ring{width:42px;height:42px;margin:-21px 0 0 -21px;border:2.5px solid #fff;border-radius:50%;rotate:0deg;transition:width .3s cubic-bezier(.2,1.5,.4,1),height .3s cubic-bezier(.2,1.5,.4,1),margin .3s cubic-bezier(.2,1.5,.4,1),border-radius .3s,rotate .4s cubic-bezier(.2,1.5,.4,1),scale .2s}
  .cu-tri{width:26px;height:24px;margin:-12px 0 0 -13px;background:#fff;clip-path:polygon(50% 0,100% 100%,0 100%);scale:0;rotate:-90deg;transition:scale .25s cubic-bezier(.2,1.7,.4,1),rotate .35s cubic-bezier(.2,1.5,.4,1)}
  .cu.card .cu-ring{width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:0;rotate:45deg}
  .cu.card .cu-dot{scale:.5}
  .cu.btn .cu-dot{scale:0}
  .cu.btn .cu-tri{scale:1;rotate:0deg}
  .cu.btn .cu-ring{width:58px;height:58px;margin:-29px 0 0 -29px;rotate:90deg;border-radius:30%}
  .cu.down .cu-ring{scale:.65}
  #fx{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:100000;pointer-events:none}
}
.geo-m,.b-bar,.fab{display:none}
.pal button[aria-current="true"]{box-shadow:inset 0 -9px 0 var(--ink)}
@media(max-width:999px){
  .geo{display:none}
  .geo-m{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:-1}
  .poster{grid-template-columns:1fr;min-height:min(88svh,740px)}
  .poster-text{justify-content:flex-end}
  .pal{position:sticky;top:0;z-index:40}
  .band{grid-template-columns:minmax(120px,30%) minmax(0,1fr);min-height:0;scroll-margin-top:var(--palh,0px)}
  .b-info{border-inline-end:0}
  .b-roster{grid-column:1/-1;border-top:4px solid var(--ink);grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .band[data-rv]{clip-path:inset(0 0 calc(100% - 4px) 0)}
  .band[data-rv].in{clip-path:inset(-60px);transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
  .fab{display:grid;place-items:center;position:fixed;left:14px;bottom:max(16px,env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--yellow);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);z-index:60;opacity:0;pointer-events:none;transform:scale(.5) rotate(-40deg);transition:opacity .25s,transform .4s cubic-bezier(.2,1.8,.4,1)}
  .fab.show{opacity:1;pointer-events:auto;transform:none}
  .fab:active{box-shadow:1px 1px 0 var(--ink);translate:3px 3px}
  .fab svg{width:22px;height:22px}
}
@media(max-width:620px){
  h1{font-size:clamp(66px,19.5vw,112px)}
  .band{display:block}
  .b-shape{position:relative;display:block;height:220px;padding:0;border-inline-end:0;border-bottom:0}
  .shape{position:absolute;left:-34px;top:50%;width:250px;height:250px;margin-top:-125px}
  .b-num{inset:0 auto 0 -4px;width:222px;font-size:176px}
  .b-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:var(--palh,56px);z-index:20;padding:2px 16px;background:var(--bg);color:var(--fg);border-block:4px solid var(--ink);font:900 clamp(30px,9vw,40px)/1.35 'Kenaar','Peyda',sans-serif}
  .bc{font:900 13px/1.8 'Peyda',sans-serif;background:var(--fg);color:var(--bg);padding:0 12px;white-space:nowrap}
  .b-info{display:block;padding:20px 16px 6px}
  .b-info h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .cnt{display:none}
  .tas{flex-direction:row;flex-wrap:wrap;gap:14px 12px}
  .tas li{font-size:16px;padding:3px 16px 3px 12px}
  .b-roster{border-top:0;grid-template-columns:minmax(0,1fr);padding:6px 16px 28px}
  .b-roster li{font-size:17px;padding:9px 6px}
  .b-roster li::after{content:"";margin-inline-start:auto;flex:none;width:12px;height:12px;background:currentColor;align-self:center}
  .b-roster li:nth-child(3n+1)::after{border-radius:50%}
  .b-roster li:nth-child(3n)::after{clip-path:polygon(50% 0,100% 100%,0 100%)}
  .pal button{padding:10px 2px 8px}.pal button small{display:none}
  .tools{flex-direction:column}
  .count{padding:10px;border-inline-start:0;border-top:4px solid var(--ink)}
  .meta{margin-top:18px}
  .back{padding:4px 12px;font-size:13px;box-shadow:4px 4px 0 var(--ink)}
}
@media(hover:none){.b-roster li:active{background-size:100% 100%;color:var(--bg)}}
@media(prefers-reduced-motion:reduce){.sh,.ticker div,.count.bump{animation:none}.sh{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<a class="skip" href="#groups">رفتن به گروه‌ها</a>
<header class="bar">
  <b><i aria-hidden="true"></i>درس ساختمان داده‌ها</b>
  <a class="back" href="index.html">همه گروه‌بندی‌ها</a>
</header>
<section class="poster" id="poster" aria-labelledby="t">
  <svg class="geo" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g class="sh" style="--d:10;--rk:.1;--t:.05s;--fx:-700px;--fy:-100px;--fr:-40deg"><path d="M0 0H470A470 470 0 0 1 0 470Z" fill="#2677C9"/></g>
    <g class="sh" style="--d:-26;--rk:.05;--t:.18s;--fx:-500px;--fy:300px;--fr:90deg"><circle cx="330" cy="360" r="235" fill="#F5C518"/></g>
    <g class="sh" style="--d:34;--rk:-.08;--t:.32s;--fx:0px;--fy:600px;--fr:30deg"><polygon points="170,720 620,720 395,360" fill="#D93636"/></g>
    <g class="sh" style="--d:-14;--rk:.12;--t:.46s;--fx:700px;--fy:-300px;--fr:120deg"><rect x="780" y="70" width="150" height="150" fill="#D94E9A" transform="rotate(45 855 145)"/></g>
    <g class="sh" style="--d:20;--rk:-.1;--t:.6s;--fx:500px;--fy:500px;--fr:-120deg"><path d="M560 190A110 110 0 0 1 780 190Z" fill="#27834A"/></g>
    <g class="sh" style="--d:-30;--rk:0;--t:.74s;--fx:900px;--fy:0px;--fr:0deg"><rect x="0" y="640" width="330" height="48" fill="#121212"/></g>
    <g class="sh" style="--d:42;--rk:.2;--t:.88s;--fx:0px;--fy:-600px;--fr:200deg"><circle cx="150" cy="420" r="74" fill="#fffdf7" stroke="#121212" stroke-width="10"/><circle cx="150" cy="420" r="16" fill="#121212"/></g>
    <g class="sh" style="--d:-18;--rk:-.05;--t:1s;--fx:-300px;--fy:-400px;--fr:60deg" stroke="#121212" stroke-width="8"><path d="M560 60H760M560 92H760M560 124H760" fill="none"/></g>
    <g class="sh" style="--d:24;--rk:.3;--t:1.1s;--fx:300px;--fy:-400px;--fr:-200deg"><path d="M40 540h30v-30h30v30h30v30h-30v30h-30v-30h-30z" fill="#121212"/></g>
  </svg>
  <svg class="geo-m" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g class="sh" style="--rk:.1;--t:.05s;--fx:-400px;--fy:-100px;--fr:-40deg"><path d="M0 0H300A300 300 0 0 1 0 300Z" fill="#2677C9"/></g>
    <g class="sh" style="--rk:.05;--t:.2s;--fx:400px;--fy:200px;--fr:90deg"><circle cx="255" cy="215" r="150" fill="#F5C518"/></g>
    <g class="sh" style="--rk:-.08;--t:.35s;--fx:0px;--fy:500px;--fr:30deg"><polygon points="20,640 380,640 200,330" fill="#D93636"/></g>
    <g class="sh" style="--rk:.15;--t:.5s;--fx:-300px;--fy:-300px;--fr:120deg"><rect x="40" y="330" width="90" height="90" fill="#D94E9A" transform="rotate(45 85 375)"/></g>
    <g class="sh" style="--rk:-.1;--t:.65s;--fx:300px;--fy:-300px;--fr:-120deg"><path d="M250 90A62 62 0 0 1 374 90Z" fill="#27834A"/></g>
    <g class="sh" style="--rk:0;--t:.8s;--fx:-300px;--fy:0px;--fr:0deg" stroke="#121212" stroke-width="8"><path d="M30 70H190M30 98H190M30 126H190" fill="none"/></g>
    <g class="sh" style="--rk:.2;--t:.95s;--fx:300px;--fy:300px;--fr:200deg"><circle cx="338" cy="300" r="42" fill="#fffdf7" stroke="#121212" stroke-width="9"/><circle cx="338" cy="300" r="10" fill="#121212"/></g>
    <g class="sh" style="--rk:.3;--t:1.1s;--fx:-200px;--fy:300px;--fr:-200deg"><path d="M312 436h20v-20h20v20h20v20h-20v20h-20v-20h-20z" fill="#121212"/></g>
  </svg>
  <div class="poster-text">
    <h1 id="t"><span>ساختمان</span><span>داده‌ها</span></h1>
    <p class="meta"><em>گروه‌بندی تمرین دوم</em><br>استاد درس: دکتر افسانه فاطمی</p>
  </div>
</section>
<div class="ticker" aria-hidden="true"><div id="ticker"></div></div>
<nav class="pal" id="pal" aria-label="پرش به گروه"></nav>
<section class="tools" aria-label="جست‌وجو">
  <label><span class="sr-only">جست‌وجوی دانشجو یا دستیار</span><input id="q" type="search" placeholder="نام دانشجو یا دستیار را بنویسید" autocomplete="off"></label>
  <span class="count" id="count" aria-live="polite"></span>
</section>
<main id="groups"></main>
<p class="empty" id="empty" role="status" hidden>نتیجه‌ای پیدا نشد. عبارت را کوتاه‌تر کنید.</p>
<footer class="foot"><span>Designed by ATLAS</span></footer>
<button class="fab" id="fab" type="button" aria-label="بازگشت به بالا"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 21 20H3z" fill="#121212"/></svg></button>
<div class="sb" id="sb" aria-hidden="true"><div class="sb-line"></div><div class="sb-ticks"></div><div class="sb-thumb" id="sbThumb"></div><div class="sb-tip" id="sbTip"></div></div>
<div class="cu" id="cu" aria-hidden="true"><i class="w" id="wRing"><i class="cu-ring"></i></i><i class="w" id="wDot"><i class="cu-dot"></i></i><i class="w" id="wTri"><i class="cu-tri"></i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
(()=>{
  const $=s=>document.querySelector(s),root=document.documentElement;
  const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
  const fa=n=>Number(n).toLocaleString('fa-IR');
  (()=>{
    const track=$('#ticker'),unit='<span>DATA STRUCTURES<i></i>ساختمان داده‌ها<i></i>TREE<i></i>STACK<i></i>QUEUE<i></i>GRAPH<i></i></span>';
    function build(){
      track.innerHTML=unit;const w=track.getBoundingClientRect().width||600;
      const n=Math.max(1,Math.ceil(innerWidth/w)),half=unit.repeat(n);
      track.innerHTML=half+half;
      track.style.setProperty('--dur',Math.max(12,(w*n)/90).toFixed(1)+'s');
    }
    build();let rt=0;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,150);});
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(build);
  })();

  const bar=$('.bar');
  const setSticky=()=>root.style.setProperty('--sticky',(bar.offsetHeight-4)+'px');
  setSticky();addEventListener('resize',setSticky);
  const palEl=$('#pal'),fab=$('#fab');
  const setPal=()=>root.style.setProperty('--palh',(palEl.offsetHeight||56)+'px');
  setPal();addEventListener('resize',setPal);
  if('ResizeObserver' in window)new ResizeObserver(setPal).observe(palEl);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setPal);
  fab.addEventListener('click',()=>scrollTo({top:0,behavior:RM?'instant':'smooth'}));
  const fabTick=()=>fab.classList.toggle('show',scrollY>700);
  addEventListener('scroll',fabTick,{passive:true});fabTick();
  let spinWait=false;
  const spin=()=>{spinWait=false;const h=innerHeight;document.querySelectorAll('.shape').forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom<0||r.top>h)return;el.style.setProperty('--rot',((r.top/h)*140).toFixed(1)+'deg');});};
  if(!RM){
    addEventListener('scroll',()=>{if(!spinWait){spinWait=true;requestAnimationFrame(spin);}},{passive:true});
    addEventListener('resize',spin);
  }
  addEventListener('bands',()=>{setPal();if(!RM)spin();});

  const poster=$('#poster');
  if(!RM){
    if(FINE){
      poster.addEventListener('pointermove',e=>{const r=poster.getBoundingClientRect();poster.style.setProperty('--px',((e.clientX-r.left)/r.width-.5).toFixed(3));poster.style.setProperty('--py',((e.clientY-r.top)/r.height-.5).toFixed(3));},{passive:true});
      poster.addEventListener('pointerleave',()=>{poster.style.setProperty('--px',0);poster.style.setProperty('--py',0);});
    }
    let tick=false;
    addEventListener('scroll',()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;if(scrollY<innerHeight*1.4)poster.style.setProperty('--sr',scrollY.toFixed(0));});},{passive:true});
  }

  if(FINE){
    const sb=$('#sb'),thumb=$('#sbThumb'),tip=$('#sbTip');
    root.classList.add('js-sb');
    let docH=1,vh=1,trackH=1,th=64,raf=0,dragging=false,y0=0,s0=0;
    function measure(){vh=innerHeight;docH=Math.max(root.scrollHeight,vh+1);trackH=sb.clientHeight||1;th=Math.max(64,Math.min(trackH,trackH*vh/docH));sb.style.setProperty('--th',th.toFixed(1)+'px');}
    function paint(){
      raf=0;const max=Math.max(1,docH-vh),p=Math.min(1,Math.max(0,scrollY/max)),ty=p*(trackH-th);
      sb.style.setProperty('--ty',ty.toFixed(1)+'px');tip.textContent=fa(Math.round(p*100))+'٪';
      const el=document.elementFromPoint(innerWidth/2,innerHeight/2),band=el&&el.closest&&el.closest('.band');
      sb.style.setProperty('--tc',band?getComputedStyle(band).getPropertyValue('--bg').trim()||'#F5C518':'#F5C518');
    }
    const req=()=>{if(!raf)raf=requestAnimationFrame(paint);};
    addEventListener('scroll',req,{passive:true});
    addEventListener('resize',()=>{measure();req();});
    if('ResizeObserver' in window)new ResizeObserver(()=>{measure();req();}).observe(document.body);
    measure();paint();
    thumb.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();dragging=true;y0=e.clientY;s0=scrollY;thumb.setPointerCapture(e.pointerId);sb.classList.add('drag');});
    thumb.addEventListener('pointermove',e=>{if(!dragging)return;const k=(docH-vh)/Math.max(1,trackH-th);scrollTo({top:s0+(e.clientY-y0)*k,behavior:'instant'});});
    const end=()=>{dragging=false;sb.classList.remove('drag');};
    thumb.addEventListener('pointerup',end);thumb.addEventListener('pointercancel',end);
    sb.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.sb-thumb'))return;const r=sb.getBoundingClientRect(),p=(e.clientY-r.top-th/2)/Math.max(1,trackH-th);scrollTo({top:Math.max(0,Math.min(1,p))*(docH-vh),behavior:RM?'instant':'smooth'});});
  }
  if(RM)return;

  const cv=$('#fx'),ctx=cv.getContext('2d');
  let W=0,H=0;
  const size=()=>{const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);};
  size();addEventListener('resize',size);
  const COLORS=['#2677C9','#D93636','#F5C518','#27834A','#D94E9A','#121212'];
  const bits=[];let raf2=0;
  function burst(x,y,n,spread){
    for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(Math.random()*.6+.4)*spread;
      bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,r:Math.random()*6.28,vr:(Math.random()-.5)*.35,s:6+Math.random()*8,k:(Math.random()*3)|0,c:COLORS[(Math.random()*6)|0],t:performance.now()});}
    if(!raf2)raf2=requestAnimationFrame(draw);
  }
  function draw(now){
    raf2=0;ctx.clearRect(0,0,W,H);
    for(let i=bits.length-1;i>=0;i--){const b=bits[i],age=now-b.t;
      if(age>850){bits.splice(i,1);continue;}
      b.vy+=.12;b.vx*=.985;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;
      ctx.save();ctx.globalAlpha=Math.max(0,1-age/850);ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;ctx.strokeStyle='#121212';ctx.lineWidth=1.6;ctx.beginPath();
      if(b.k===0)ctx.rect(-b.s/2,-b.s/2,b.s,b.s);else if(b.k===1)ctx.arc(0,0,b.s/2,0,6.283);else{ctx.moveTo(0,-b.s/2);ctx.lineTo(b.s/2,b.s/2);ctx.lineTo(-b.s/2,b.s/2);ctx.closePath();}
      ctx.fill();ctx.stroke();ctx.restore();}
    if(bits.length)raf2=requestAnimationFrame(draw);
  }
  addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;burst(e.clientX,e.clientY,e.pointerType==='mouse'?14:9,4);},{passive:true});
  if(!FINE)return;

  const cu=$('#cu'),ring=$('#wRing'),dot=$('#wDot'),tri=$('#wTri'),body=document.body;
  let mx=-100,my=-100,rx=-100,ry=-100,on=false,loop=0;
  const put=(el,x,y)=>el.style.transform=`translate3d(${x}px,${y}px,0)`;
  function frame(){loop=0;rx+=(mx-rx)*.2;ry+=(my-ry)*.2;put(ring,rx,ry);if(Math.abs(mx-rx)>.3||Math.abs(my-ry)>.3)loop=requestAnimationFrame(frame);}
  addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse')return;
    mx=e.clientX;my=e.clientY;put(dot,mx,my);put(tri,mx,my);
    if(!on){on=true;rx=mx;ry=my;body.classList.add('cu-on');}
    const t=e.target instanceof Element?e.target:null;
    body.classList.toggle('cu-native',!!(t&&t.closest('input,textarea')));
    cu.classList.toggle('btn',!!(t&&t.closest('a,button,.sb')));
    cu.classList.toggle('card',!!(t&&!t.closest('a,button,.sb')&&t.closest('.band,.poster')));
    if(!loop)loop=requestAnimationFrame(frame);
  },{passive:true});
  addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0)cu.classList.add('down');});
  addEventListener('pointerup',()=>cu.classList.remove('down'));
  document.documentElement.addEventListener('pointerleave',()=>{on=false;body.classList.remove('cu-on');});
})();
</script>
<script type="module">
import { GROUPS } from './groups-02.js';
const $=(s,r=document)=>r.querySelector(s);
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const fa=n=>Number(n).toLocaleString('fa-IR');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v).normalize('NFC').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/\u200c/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').toLocaleLowerCase('fa-IR').trim();
const collator=new Intl.Collator('fa',{sensitivity:'base',ignorePunctuation:true});
const SORTED=GROUPS.map(g=>[...g.students].sort(collator.compare));
function filterGroups(q){
  const n=norm(q),out=[];
  GROUPS.forEach((g,i)=>{
    const all=SORTED[i];
    if(!n){out.push({g,i,students:all});return;}
    const taHit=g.tas.some(t=>norm(t).includes(n));
    const found=all.filter(s=>norm(s).includes(n));
    if(taHit||found.length)out.push({g,i,students:taHit?all:found});
  });
  return out;
}
function hl(t,q){
  const s=(q||'').trim();
  if(!s)return esc(t);
  const i=t.toLowerCase().indexOf(s.toLowerCase());
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+s.length))+'</mark>'+esc(t.slice(i+s.length));
}
const COLORS=['#2677C9','#D93636','#F5C518','#27834A','#D94E9A','#292929'];
const LABEL_FG=['#fffdf7','#fffdf7','#121212','#fffdf7','#fffdf7','#f5f1e8'];
const SHAPE_FILL=[['#F5C518','#D93636'],['#121212','#F5C518'],['#2677C9','#D93636'],['#F5C518','#D94E9A'],['#121212','#F5C518'],['#F5C518','#f5f1e8']];
const SHAPES=[
  (a,b)=>`<circle cx="50" cy="50" r="46" fill="${a}"/><circle cx="50" cy="50" r="20" fill="${b}"/>`,
  (a,b)=>`<rect x="6" y="6" width="88" height="88" fill="${a}"/><rect x="30" y="30" width="40" height="40" fill="${b}"/>`,
  (a,b)=>`<polygon points="50,4 96,94 4,94" fill="${a}"/><polygon points="50,46 72,86 28,86" fill="${b}"/>`,
  (a,b)=>`<path d="M2 78A48 48 0 0 1 98 78Z" fill="${a}"/><rect x="2" y="78" width="96" height="14" fill="${b}"/>`,
  (a,b)=>`<rect x="34" y="4" width="32" height="92" fill="${a}"/><rect x="4" y="34" width="92" height="32" fill="${b}"/>`,
  (a,b)=>`<path d="M4 96V4A92 92 0 0 1 96 96Z" fill="${a}"/><circle cx="34" cy="64" r="14" fill="${b}"/>`
];
const wrap=$('#groups'),pal=$('#pal');
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:0,rootMargin:'0px 0px -3% 0px'}):null;
function reveal(root){root.querySelectorAll('[data-rv]:not(.in)').forEach(el=>{if(!io||RM)el.classList.add('in');else io.observe(el);});}
let spy=null;
function watch(){
  if(spy)spy.disconnect();
  if(!('IntersectionObserver' in window))return;
  spy=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;pal.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.g===e.target.id.slice(1))));}),{rootMargin:'-45% 0px -50% 0px'});
  wrap.querySelectorAll('.band').forEach(b=>spy.observe(b));
}
function render(res,q){
  wrap.innerHTML=res.map(({g,i,students},k)=>{
    const c=i%6,[s1,s2]=SHAPE_FILL[c];
    return `<article class="band g${c}" id="g${i}" data-rv style="--k:${Math.min(k,5)}"><div class="b-shape"><svg class="shape" viewBox="0 0 100 100" aria-hidden="true">${SHAPES[c](s1,s2)}</svg><span class="b-num" aria-hidden="true">${fa(i+1)}</span></div><div class="b-bar" aria-hidden="true"><span>${esc(g.title)}</span><span class="bc">${fa(students.length)} دانشجو</span></div><div class="b-info"><h2>${esc(g.title)}</h2><ul class="tas" aria-label="دستیاران آموزشی">${g.tas.map((t,j)=>`<li class="${j?'b':'a'}"><span>${hl(t,q)}</span></li>`).join('')}</ul><p class="cnt"><b>${fa(students.length)} دانشجو</b></p></div><ol class="b-roster">${students.map(s=>`<li>${hl(s,q)}</li>`).join('')}</ol></article>`;
  }).join('');
  pal.innerHTML=res.map(({g,i})=>`<button type="button" data-g="${i}" style="--c:${COLORS[i%6]};--cf:${LABEL_FG[i%6]}" aria-label="رفتن به ${esc(g.title)}">${fa(i+1)}<small>${esc(g.title)}</small></button>`).join('');
  pal.style.display=res.length?'':'none';
  reveal(wrap);
  watch();
  window.dispatchEvent(new Event('bands'));
}
pal.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const el=document.getElementById('g'+b.dataset.g);
  if(el)el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});
});
const input=$('#q'),count=$('#count'),empty=$('#empty');
let first=true;
function update(){
  const q=input.value.trim(),res=filterGroups(q);
  const n=res.reduce((a,r)=>a+r.students.length,0);
  count.textContent=q?`${fa(n)} نتیجه در ${fa(res.length)} گروه`:`${fa(GROUPS.length)} گروه`;
  if(!first){count.classList.remove('bump');void count.offsetWidth;count.classList.add('bump');}
  first=false;
  empty.hidden=res.length>0;
  render(res,q);
}
input.addEventListener('input',update);
input.addEventListener('keydown',e=>{if(e.key==='Escape'&&input.value){e.preventDefault();input.value='';update();}});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==input&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();input.focus();}
});
update();
</script>
