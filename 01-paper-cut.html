.pc-cursor{display:none}
@media (hover:hover) and (pointer:fine){
  html,body,a,button,input{cursor:none}
  .pc-cursor{display:block;position:fixed;left:0;top:0;width:0;height:0;z-index:100000;pointer-events:none;opacity:0;will-change:transform;direction:ltr}
  .pc-cursor.visible{opacity:1}
  .pc-halo{position:absolute;left:0;top:0;width:34px;height:34px;border:1.5px solid #45382b;border-radius:48% 52% 45% 55%;background:rgba(255,250,240,.22);box-shadow:2px 2px 0 rgba(196,73,43,.65),0 0 0 1px rgba(255,250,240,.55);transform:translate(-50%,-50%) rotate(-12deg);transition:width .18s ease,height .18s ease,background .18s ease,border-radius .18s ease,box-shadow .18s ease}
  .pc-halo:before{content:"";position:absolute;inset:5px;background:rgba(235,169,58,.72);clip-path:polygon(8% 0,92% 8%,100% 50%,76% 94%,30% 100%,0 64%);transform:rotate(16deg)}
  .pc-halo:after{content:"";position:absolute;right:-2px;top:-2px;width:6px;height:6px;background:#a8cdd6;border:1px solid #45382b;border-radius:1px;transform:rotate(25deg)}
  .pc-pointer{position:absolute;left:-1px;top:-1px;width:20px;height:28px;background:#45382b;clip-path:polygon(0 0,0 100%,29% 76%,43% 100%,57% 94%,44% 70%,83% 68%);filter:drop-shadow(1.5px 2px 0 rgba(196,73,43,.8));z-index:3}
  .pc-pointer:after{content:"";position:absolute;inset:2px 3px 3px 2px;background:#fffaf0;clip-path:polygon(0 0,0 100%,29% 76%,43% 100%,57% 94%,44% 70%,83% 68%)}
  .pc-pointer:before{content:"";position:absolute;left:3px;top:3px;width:5px;height:10px;background:#c4492b;clip-path:polygon(0 0,100% 35%,30% 100%);z-index:4}
  .pc-cursor.hover .pc-halo{width:43px;height:43px;background:rgba(255,250,240,.35);border-radius:50% 44% 48% 52%;box-shadow:2px 2px 0 rgba(43,107,90,.7),0 0 0 1px rgba(255,250,240,.6)}
  .pc-cursor.down .pc-halo{width:27px;height:27px;background:rgba(238,177,166,.6);border-radius:42% 58% 55% 45%}
  .pc-cursor.text .pc-halo{width:27px;height:32px;border-radius:4px;box-shadow:2px 2px 0 rgba(168,205,214,.85)}
  .pc-cursor.text .pc-pointer{opacity:.35}
  .pc-confetti{position:fixed;left:0;top:0;width:5px;height:7px;z-index:99999;pointer-events:none;animation:pc-paper-pop .42s ease-out forwards}
  @keyframes pc-paper-pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
}
@media (hover:none),(pointer:coarse){
  .pc-cursor,.pc-confetti{display:none!important}
}

<a class="skip" href="#groups">رفتن به گروه‌ها</a>
<header class="top">
  <div class="brand"><img src="assets/logo.png" alt="" width="44" height="44" onerror="this.remove()"><span>درس ساختمان داده‌ها</span></div>
</header>
<section class="hero" id="hero" aria-labelledby="t">
  <div class="layer l-sun" aria-hidden="true"></div>

  <div class="title-sheet">

<div class="pc-cursor" id="pcCursor" aria-hidden="true">
  <div class="pc-halo"></div>
  <div class="pc-pointer"></div>
</div>

<script>
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
if(matchMedia('(hover:hover) and (pointer:fine)').matches){
  const cursor=document.getElementById('pcCursor');
  const halo=cursor.querySelector('.pc-halo');
  let mx=0,my=0,hx=0,hy=0,frameId=0,shown=false;
  const palette=['#c4492b','#eba93a','#2b6b5a','#a8cdd6','#eeb1a6'];

  function animateCursor(){
    frameId=0;
    hx+=(mx-hx)*.22;
    hy+=(my-hy)*.22;
    halo.style.left=`${hx-mx}px`;
    halo.style.top=`${hy-my}px`;
    if(Math.abs(mx-hx)>.2||Math.abs(my-hy)>.2) frameId=requestAnimationFrame(animateCursor);
  }
  document.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse'&&e.pointerType!=='pen')return;
    mx=e.clientX;my=e.clientY;
    cursor.style.transform=`translate3d(${mx}px,${my}px,0)`;
    if(!shown){shown=true;hx=mx;hy=my;cursor.classList.add('visible');}
    if(!frameId)frameId=requestAnimationFrame(animateCursor);
  },{passive:true});

  document.addEventListener('pointerout',e=>{
    if(!e.relatedTarget){shown=false;cursor.classList.remove('visible');}
  });
  document.addEventListener('pointerover',e=>{
    if(e.pointerType==='touch')return;
    const target=e.target instanceof Element?e.target:null;
    if(!target)return;
    cursor.classList.toggle('hover',!!target.closest('.sheet,.brand,.title-sheet,.stamp,.count,.tape-input,a,button'));
    cursor.classList.toggle('text',!!target.closest('input,textarea,[contenteditable="true"]'));
  });
  document.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    cursor.classList.add('down');
    if(RM)return;
    for(let i=0;i<5;i++){
      const bit=document.createElement('i');
      bit.className='pc-confetti';
      bit.style.left=`${e.clientX}px`;
      bit.style.top=`${e.clientY}px`;
      bit.style.background=palette[i];
      bit.style.setProperty('--dx',`${(Math.random()-.5)*58}px`);
      bit.style.setProperty('--dy',`${(Math.random()-.5)*58}px`);
      bit.style.setProperty('--rot',`${Math.random()*180-90}deg`);
      document.body.appendChild(bit);
      bit.addEventListener('animationend',()=>bit.remove(),{once:true});
    }
  });
  document.addEventListener('pointerup',()=>cursor.classList.remove('down'));
  window.addEventListener('blur',()=>{shown=false;cursor.classList.remove('visible','down');});
}
</script>

<script type="module">
import { GROUPS } from './groups-01.js';

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const fa=n=>Number(n).toLocaleString('fa-IR');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v).normalize('NFC').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/\u200c/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').toLocaleLowerCase('fa-IR').trim();
const collator=new Intl.Collator('fa',{sensitivity:'base',ignorePunctuation:true});
const SORTED=GROUPS.map(g=>[...g.students].sort(collator.compare));
const TOTAL_STUDENTS=GROUPS.reduce((a,g)=>a+g.students.length,0);
const TOTAL_TAS=GROUPS.reduce((a,g)=>a+g.tas.length,0);

function filterGroups(q){
  const n=norm(q),out=[];
  GROUPS.forEach((g,i)=>{
    const all=SORTED[i];
    if(!n){out.push({g,i,students:all,taHit:false});return;}
    const taHit=g.tas.some(t=>norm(t).includes(n));
    const found=all.filter(s=>norm(s).includes(n));
    if(taHit||found.length)out.push({g,i,students:taHit?all:found,taHit});
  });
  return out;
}
function hl(t,q){
  const s=(q||'').trim();
  if(!s)return esc(t);
  const i=t.toLowerCase().indexOf(s.toLowerCase());
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+s.length))+'</mark>'+esc(t.slice(i+s.length));
}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.06,rootMargin:'0px 0px -3% 0px'}):null;
function reveal(root=document){$$('[data-rv]:not(.in)',root).forEach(el=>{if(!io||RM)el.classList.add('in');else io.observe(el);});}
function mount(render){
  const input=$('#q'),count=$('#count'),empty=$('#empty');
  let q='';
  const ctl={
    get q(){return q.trim();},
    run(){
      const res=filterGroups(q);
      const n=res.reduce((a,r)=>a+r.students.length,0);
      if(count)count.textContent=q.trim()?`${fa(n)} نتیجه در ${fa(res.length)} گروه`:`${fa(GROUPS.length)} گروه`;
      if(empty)empty.hidden=res.length>0;
      render(res,q.trim(),ctl);
    },
    clear(){q='';if(input)input.value='';ctl.run();}
  };
  if(input){
    input.addEventListener('input',()=>{q=input.value;ctl.run();});
    input.addEventListener('keydown',e=>{if(e.key==='Escape'&&input.value){e.preventDefault();ctl.clear();}});
  }
  document.addEventListener('keydown',e=>{
    if(e.key==='/'&&input&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();input.focus();}
  });
  ctl.run();
  return ctl;
}
const PAPERS=['#fffaf0','#f7e6b8','#d6e6dd','#f7d9cf','#dbe8ee','#fffaf0'];
const TILT=[-1.4,1,-.5,1.5,-1,.6];
const board=$('#groups');
mount((res,q)=>{
  board.innerHTML=res.map(({g,i,students},k)=>`<article class="sheet" data-rv style="--r:${TILT[i%6]}deg;--p:${PAPERS[i%6]};--d:${Math.min(k,5)*.07}s"><i class="tape"></i><div class="paper"><div class="head"><span class="no" aria-hidden="true">${fa(i+1)}</span><h2>${esc(g.title)}</h2></div><div class="tas"><span class="lbl">دستیاران آموزشی</span>${g.tas.map(t=>`<span class="stamp">${hl(t,q)}</span>`).join('')}</div><p class="cnt">${fa(students.length)} دانشجو</p><ol>${students.map(s=>`<li>${hl(s,q)}</li>`).join('')}</ol></div></article>`).join('');
  reveal(board);
});
if(FINE&&!RM){
  const hero=$('#hero');
  hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();hero.style.setProperty('--px',((e.clientX-r.left)/r.width-.5).toFixed(3));hero.style.setProperty('--py',((e.clientY-r.top)/r.height-.5).toFixed(3));},{passive:true});
}


</script>
