<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d6c4a0">
<title>درس ساختمان داده‌ها | گروه‌بندی</title>

<style>
@font-face{font-family:IRANYekanX;src:url("fonts/x ایران یکان/IRANYekanX Pro/Variable Font/webfont/IRANYekanXVF.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Peyda;src:url("fonts/پیدا/PeydaWeb/woff2/PeydaWeb-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Peyda;src:url("fonts/پیدا/PeydaWeb/woff2/PeydaWeb-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Peyda;src:url("fonts/پیدا/PeydaWeb/woff2/PeydaWeb-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Peyda;src:url("fonts/پیدا/PeydaWeb/woff2/PeydaWeb-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Peyda;src:url("fonts/پیدا/PeydaWeb/woff2/PeydaWeb-Black.woff2") format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:Hasti;src:url("fonts/هستی/Hasti package 1.4 [@fontiranir]/Webfonts/Hasti-Heavy.woff") format("woff");font-weight:900;font-display:swap}
@font-face{font-family:Gramophone;src:url("fonts/گرامافون/01- Gramophone Font/02- Webfonts/02 - Woff2/Gramophone-Clean.woff2") format("woff2");font-display:swap}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;overflow-x:hidden;font-family:IRANYekanX,Peyda,Tahoma,sans-serif;color:#2a2118;line-height:1.8;background:#d6c4a0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:root{--kraft:#d6c4a0;--sheet:#fffaf0;--ink:#2a2118;--rust:#c4492b;--pine:#2b6b5a;--sun:#eba93a;--sky:#a8cdd6;--rose:#eeb1a6;--shadow:rgba(60,40,15,.3)}
:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
mark{background:var(--sun);color:var(--ink);padding:0 2px}
.skip{position:absolute;top:-70px;inset-inline-start:8px;z-index:9999;background:#fff;color:#000;padding:10px 14px;border:2px solid #000;font-weight:700}
.skip:focus{top:8px}

.top{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,56px)}
.brand{display:flex;align-items:center;gap:12px;font:900 18px Peyda,IRANYekanX,sans-serif}
.brand img{width:44px;height:44px;object-fit:contain}

.hero{position:relative;min-height:min(82vh,760px);display:grid;place-items:center;padding:30px clamp(16px,4vw,56px) 70px;isolation:isolate}
.layer{position:absolute;transform:translate(calc(var(--px,0)*var(--d,10)*1px),calc(var(--py,0)*var(--d,10)*1px)) rotate(var(--rot,0deg));transition:transform .35s ease-out;filter:drop-shadow(4px 7px 0 rgba(60,40,15,.22)) drop-shadow(0 14px 16px var(--shadow));z-index:-1;animation:land .9s cubic-bezier(.2,1.2,.3,1) both;animation-delay:var(--t,0s)}
.l-sun{width:min(46vw,420px);aspect-ratio:1;border-radius:50%;background:var(--sun);top:2%;inset-inline-end:4%;--d:-18;--t:.15s}
.l-pine{width:min(40vw,360px);aspect-ratio:1.1;background:var(--pine);bottom:4%;inset-inline-start:2%;clip-path:polygon(0 100%,50% 0,100% 100%,76% 100%,50% 40%,24% 100%);--rot:-8deg;--d:24;--t:.3s}
.l-tri{width:min(30vw,260px);aspect-ratio:1;background:var(--rust);bottom:10%;inset-inline-end:14%;clip-path:polygon(0 0,100% 18%,62% 100%);--rot:12deg;--d:14;--t:.45s}
.l-sky{width:min(34vw,300px);aspect-ratio:1.4;background:var(--sky);top:8%;inset-inline-start:6%;clip-path:polygon(4% 8%,100% 0,92% 100%,0 86%);--rot:-6deg;--d:-10;--t:.6s}
.l-wave{width:min(36vw,330px);height:60px;top:46%;inset-inline-start:10%;--d:30;--t:.75s;z-index:0}
@keyframes land{from{opacity:0;translate:0 -60px;scale:.8}to{opacity:1;translate:0 0;scale:1}}

.title-sheet{position:relative;z-index:2;max-width:760px;width:100%;background:var(--sheet);padding:clamp(26px,4vw,56px) clamp(24px,4vw,60px);transform:rotate(-1.6deg);filter:drop-shadow(5px 8px 0 rgba(60,40,15,.2)) drop-shadow(0 20px 22px var(--shadow));clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),94% calc(100% - 2px),88% calc(100% - 10px),81% calc(100% - 1px),73% calc(100% - 9px),65% 100%,57% calc(100% - 8px),48% calc(100% - 1px),40% calc(100% - 10px),31% calc(100% - 2px),22% calc(100% - 9px),12% calc(100% - 1px),0 calc(100% - 7px));animation:land 1s .05s cubic-bezier(.2,1.2,.3,1) both}
.title-sheet::before,.title-sheet::after{content:"";position:absolute;top:-4px;width:96px;height:28px;background:rgba(235,200,120,.78);border:1px solid rgba(160,120,50,.4)}
.title-sheet::before{inset-inline-end:34px;transform:rotate(3deg)}
.title-sheet::after{inset-inline-start:30px;transform:rotate(-5deg);background:rgba(168,205,214,.8)}
h1{font:900 clamp(60px,12vw,150px)/1.12 Hasti,Peyda,IRANYekanX,sans-serif;margin:6px 0 10px;color:var(--ink);text-shadow:3px 3px 0 var(--sun),6px 6px 0 var(--rust)}
.sub{margin:0;font:700 clamp(15px,2vw,20px)/1.9 Peyda,IRANYekanX,sans-serif;border-inline-start:5px solid var(--rust);padding-inline-start:14px}
.sub small{display:block;font:400 clamp(13px,1.6vw,16px) Gramophone,Peyda,sans-serif;opacity:.75}

.finder{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:0 16px 34px}
.tape-input{display:flex;align-items:center;gap:12px;background:#1e2a27;color:#f6eed8;padding:10px 18px;min-width:min(520px,92vw);transform:rotate(.7deg);box-shadow:4px 6px 0 rgba(60,40,15,.28);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.tape-input span{font:700 13px Peyda,sans-serif;color:var(--sun);white-space:nowrap}
.tape-input input{flex:1;min-width:0;background:transparent;border:0;outline:0;font:600 17px IRANYekanX,sans-serif;color:#f6eed8;padding:6px 0}
.tape-input input::placeholder{color:#f6eed8;opacity:.5}
.tape-input:focus-within{outline:3px solid var(--sun);outline-offset:3px}
.count{font:800 15px Peyda,sans-serif;background:var(--sheet);padding:6px 14px;transform:rotate(-1.5deg);box-shadow:3px 3px 0 rgba(60,40,15,.25)}

.board{columns:3;column-gap:38px;padding:10px clamp(16px,4vw,56px) 40px;max-width:1500px;margin:0 auto}
.sheet{break-inside:avoid;margin:0 0 46px;position:relative;transform:rotate(var(--r,0deg));filter:drop-shadow(3px 5px 0 rgba(60,40,15,.2)) drop-shadow(0 14px 14px var(--shadow));transition:transform .35s cubic-bezier(.2,1.3,.4,1)}
.sheet[data-rv]{opacity:0;translate:0 -40px;rotate:-3deg}
.sheet[data-rv].in{opacity:1;translate:0 0;rotate:0deg;transition:opacity .5s var(--d,0s),translate .7s var(--d,0s) cubic-bezier(.2,1.4,.4,1),rotate .7s var(--d,0s) cubic-bezier(.2,1.4,.4,1),transform .35s cubic-bezier(.2,1.3,.4,1)}
.sheet:hover{transform:rotate(0deg) translateY(-6px)}

.paper{background:var(--p,var(--sheet));padding:34px 26px 34px;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),95% calc(100% - 2px),90% calc(100% - 9px),84% calc(100% - 1px),78% calc(100% - 7px),71% 100%,64% calc(100% - 9px),57% calc(100% - 2px),49% calc(100% - 7px),41% 100%,33% calc(100% - 8px),25% calc(100% - 1px),17% calc(100% - 9px),9% calc(100% - 3px),0 calc(100% - 7px))}
.tape{position:absolute;top:-12px;inset-inline-start:calc(50% - 46px);width:92px;height:26px;background:rgba(235,200,120,.82);border:1px solid rgba(160,120,50,.4);transform:rotate(var(--tr,-3deg));z-index:2}
.sheet:nth-child(even) .tape{background:rgba(168,205,214,.85);--tr:4deg}
.sheet:nth-child(3n) .tape{background:rgba(238,177,166,.85)}

.head{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;min-height:54px}
.no{position:absolute;inset-inline-end:0;top:50%;translate:0 -50%;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--rust);color:var(--sheet);font:900 28px Hasti,Peyda,sans-serif;box-shadow:3px 3px 0 var(--ink);flex:none}
h2{margin:0;text-align:center;font:900 clamp(30px,3.4vw,42px)/1.2 Hasti,Peyda,IRANYekanX,sans-serif}
.tas{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 6px;text-align:center}
.stamp{font:800 14px Peyda,IRANYekanX,sans-serif;border:2px dashed var(--rust);color:var(--rust);padding:3px 12px;border-radius:6px;transform:rotate(-2deg)}
.stamp:nth-child(2){border-color:var(--pine);color:var(--pine);transform:rotate(1.8deg)}
.lbl{width:100%;text-align:center;font:400 13px Gramophone,Peyda,sans-serif;opacity:.7}
.cnt{margin:12px 0 4px;font:700 13px Peyda,sans-serif;opacity:.75;text-align:center}
ol{list-style:none;margin:0;padding:0;counter-reset:n}
li{counter-increment:n;display:flex;gap:12px;align-items:baseline;border-bottom:1.5px solid rgba(42,33,24,.2);padding:7px 0;font:600 16px/1.7 IRANYekanX,Peyda,sans-serif;transition:padding .2s,color .2s}
li::before{content:counter(n,persian);font:900 13px Peyda,sans-serif;color:var(--rust);min-width:22px}
li:hover{padding-inline-start:8px;color:var(--rust)}
.sheet:nth-child(6n+1) .no{background:#2677C9;color:#fff}
.sheet:nth-child(6n+2) .no{background:#D93636;color:#fff}
.sheet:nth-child(6n+3) .no{background:#E8B923;color:#292114}
.sheet:nth-child(6n+4) .no{background:#27834A;color:#fff}
.sheet:nth-child(6n+5) .no{background:#D94E9A;color:#fff}
.sheet:nth-child(6n) .no{background:#F5F1E8;color:#202020}
.sheet:nth-child(6n) .paper{color:#F8F4EB}
.sheet:nth-child(6n) li{border-bottom-color:rgba(255,255,255,.22)}
.sheet:nth-child(6n) li::before{color:#F5D36C}
.sheet:nth-child(6n) li:hover{color:#F5D36C}
.sheet:nth-child(6n) .stamp{color:#F5D36C;border-color:#F5D36C}
.sheet:nth-child(6n) .stamp:nth-child(2){color:#9ED8F5;border-color:#9ED8F5}
.sheet:nth-child(6n) .lbl,.sheet:nth-child(6n) .cnt{color:#F8F4EB}

.empty{max-width:480px;margin:0 auto 60px;background:var(--sheet);padding:22px 26px;text-align:center;font:700 17px Peyda,sans-serif;transform:rotate(-1deg);box-shadow:5px 6px 0 rgba(60,40,15,.25)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:44px clamp(16px,4vw,56px) 34px;background:#2a2118;color:#f0e4c8;font:600 14px Peyda,IRANYekanX,sans-serif;clip-path:polygon(0 12px,6% 3px,13% 11px,21% 2px,30% 10px,39% 1px,48% 11px,58% 3px,67% 12px,77% 2px,86% 10px,94% 3px,100% 11px,100% 100%,0 100%)}

@media(max-width:1000px){.board{columns:2}}
@media(max-width:640px){.board{columns:1}.layer{opacity:.55}.l-wave{display:none}h1{text-shadow:2px 2px 0 var(--sun),4px 4px 0 var(--rust)}}
@media(prefers-reduced-motion:reduce){.layer,.title-sheet{animation:none}.sheet[data-rv]{opacity:1;translate:0 0;rotate:0deg}}
</style>
</head>

<body>
<a class="skip" href="#groups">رفتن به گروه‌ها</a>

<header class="top">
  <div class="brand">
    <img src="assets/logo.png" alt="" width="44" height="44" onerror="this.remove()">
    <span>درس ساختمان داده‌ها</span>
  </div>
</header>

<section class="hero" id="hero" aria-labelledby="t">
  <div class="layer l-sun" aria-hidden="true"></div>
  <div class="layer l-sky" aria-hidden="true"></div>
  <div class="layer l-pine" aria-hidden="true"></div>
  <div class="layer l-tri" aria-hidden="true"></div>
  <svg class="layer l-wave" viewBox="0 0 330 60" aria-hidden="true">
    <path d="M0 30 C30 0,60 0,90 30 S150 60,180 30 S240 0,270 30 S315 55,330 35" fill="none" stroke="#c4492b" stroke-width="14" stroke-linecap="round"/>
  </svg>
  <div class="title-sheet">
    <h1 id="t">ساختمان داده‌ها</h1>
    <p class="sub">گروه‌بندی دانشجویان<small>استاد درس: دکتر افسانه فاطمی</small></p>
  </div>
</section>

<section class="finder" aria-label="جست‌وجو">
  <label class="tape-input">
    <span>جست‌وجو</span>
    <input id="q" type="search" placeholder="نام دانشجو یا دستیار آموزشی" autocomplete="off">
  </label>
  <span class="count" id="count" aria-live="polite"></span>
</section>

<main class="board" id="groups"></main>

<p class="empty" id="empty" role="status" hidden>چیزی پیدا نشد. نام را کوتاه‌تر بنویسید یا جست‌وجو را پاک کنید.</p>

<footer class="foot">
  <span></span>
  <span>Design by ATLAS</span>
</footer>

<script type="module">
import { GROUPS } from './groups-01.js';

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
const fa=n=>Number(n).toLocaleString('fa-IR');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v).normalize('NFC').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/\u200c/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').toLocaleLowerCase('fa-IR').trim();
const collator=new Intl.Collator('fa',{sensitivity:'base',ignorePunctuation:true});
const SORTED=GROUPS.map(g=>[...g.students].sort(collator.compare));

/* رنگ پس‌زمینه هر گروه: آبی، قرمز، زرد، سبز، صورتی، مشکی */
const PAPERS=['#B9DDF5','#F5B8B5','#F8E39A','#BFE3C0','#F4C4DE','#292929'];
const TILT=[-1.4,1,-.5,1.5,-1,.6];
const board=$('#groups');

function filterGroups(q){
  const n=norm(q),out=[];
  GROUPS.forEach((g,i)=>{
    const all=SORTED[i];
    if(!n){out.push({g,i,students:all});return;}
    const taHit=g.tas.some(t=>norm(t).includes(n));
    const found=all.filter(s=>norm(s).includes(n));
    if(taHit||found.length)out.push({g,i,students:taHit?all:found});
  });
  return out;
}

function hl(t,q){
  const s=(q||'').trim();
  if(!s)return esc(t);
  const i=t.toLowerCase().indexOf(s.toLowerCase());
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+s.length))+'</mark>'+esc(t.slice(i+s.length));
}

const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.06,rootMargin:'0px 0px -3% 0px'}):null;

function reveal(root=document){
  $$('[data-rv]:not(.in)',root).forEach(el=>{
    if(!io||RM)el.classList.add('in');
    else io.observe(el);
  });
}

function render(res,q){
  board.innerHTML=res.map(({g,i,students},k)=>`
    <article class="sheet" data-rv style="--r:${TILT[i%6]}deg;--p:${PAPERS[i%6]};--d:${Math.min(k,5)*.07}s">
      <i class="tape"></i>
      <div class="paper">
        <div class="head">
          <span class="no" aria-hidden="true">${fa(i+1)}</span>
          <h2>${esc(g.title)}</h2>
        </div>
        <div class="tas">
          <span class="lbl">دستیاران آموزشی</span>
          ${g.tas.map(t=>`<span class="stamp">${hl(t,q)}</span>`).join('')}
        </div>
        <p class="cnt">${fa(students.length)} دانشجو</p>
        <ol>${students.map(s=>`<li>${hl(s,q)}</li>`).join('')}</ol>
      </div>
    </article>
  `).join('');
  reveal(board);
}

const input=$('#q');
const count=$('#count');
const empty=$('#empty');

function update(){
  const q=input.value.trim();
  const res=filterGroups(q);
  const n=res.reduce((a,r)=>a+r.students.length,0);
  count.textContent=q?`${fa(n)} نتیجه در ${fa(res.length)} گروه`:`${fa(GROUPS.length)} گروه`;
  empty.hidden=res.length>0;
  render(res,q);
}

input.addEventListener('input',update);

input.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&input.value){
    e.preventDefault();
    input.value='';
    update();
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==input&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault();
    input.focus();
  }
});

if(FINE&&!RM){
  const hero=$('#hero');
  hero.addEventListener('pointermove',e=>{
    const r=hero.getBoundingClientRect();
    hero.style.setProperty('--px',((e.clientX-r.left)/r.width-.5).toFixed(3));
    hero.style.setProperty('--py',((e.clientY-r.top)/r.height-.5).toFixed(3));
  },{passive:true});
}

update();
</script>
</body>
</html>
