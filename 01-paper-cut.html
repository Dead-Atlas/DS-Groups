    <g class="ba"><path d="M18 28.4 62 32 18 35.6z" fill="#eef2f3" stroke="#2a2118" stroke-width=".9" stroke-linejoin="round"/><path d="M12 32H24" stroke="#2a2118" stroke-width="3" stroke-linecap="round"/><circle cx="6.5" cy="32" r="5.6" fill="none" stroke="#c4492b" stroke-width="3.2"/></g>

    <circle cx="26" cy="32" r="2.6" fill="#2a2118"/>

<canvas id="cutfx" aria-hidden="true"></canvas>
<script>
(()=>{
  const $=s=>document.querySelector(s);
  const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
  (()=>{const n=44,p=[];for(let k=0;k<n*2;k++){const a=Math.PI*k/n,r=k%2?45:50;p.push((50+Math.sin(a)*r).toFixed(1)+'% '+(50-Math.cos(a)*r).toFixed(1)+'%');}
    $('#sunShape').style.clipPath='polygon('+p.join(',')+')';})();
  const hero=$('#hero'),dio=hero.querySelector('.diorama');
  dio.insertAdjacentHTML('beforeend','<div class="title-sheet"><span class="cut"></span><h1 id="t">ساختمان داده‌ها</h1><p class="sub">گروه‌بندی دانشجویان<small>استاد درس: دکتر افسانه فاطمی</small></p></div>');
  dio.querySelector('.title-sheet').removeAttribute('aria-hidden');
  if(RM)return;
  if(FINE){
    hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();hero.style.setProperty('--px',((e.clientX-r.left)/r.width-.5).toFixed(3));hero.style.setProperty('--py',((e.clientY-r.top)/r.height-.5).toFixed(3));},{passive:true});
    hero.addEventListener('pointerleave',()=>{hero.style.setProperty('--px',0);hero.style.setProperty('--py',0);});
  }
  let tick=false;
  addEventListener('scroll',()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;if(scrollY<innerHeight*1.3)hero.style.setProperty('--sy',scrollY.toFixed(0));});},{passive:true});
  const cv=$('#cutfx'),ctx=cv.getContext('2d');
  let dpr=1,W=0,H=0;
  const size=()=>{dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};
  size();addEventListener('resize',size);
  document.body.classList.add('fx');
  const COLORS=['#c4492b','#eba93a','#2b6b5a','#a8cdd6','#eeb1a6','#fffaf0'];
  const trail=[],bits=[];let fxRaf=0;
  function confetti(x,y,n,spread){
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(Math.random()*.6+.4)*spread;
      bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:4+Math.random()*5,h:6+Math.random()*6,c:COLORS[(Math.random()*COLORS.length)|0],t:performance.now()});}
    kickFx();
  }
  function fx(now){
    fxRaf=0;ctx.clearRect(0,0,W,H);
    while(trail.length&&now-trail[0].t>700)trail.shift();
    if(trail.length>1){
      ctx.lineCap='round';ctx.lineWidth=2.2;ctx.setLineDash([7,6]);
      for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],age=(now-b.t)/700;
        ctx.globalAlpha=Math.max(0,.75*(1-age));ctx.strokeStyle='#c4492b';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    for(let i=bits.length-1;i>=0;i--){const b=bits[i],age=now-b.t;
      if(age>900){bits.splice(i,1);continue;}
      b.vy+=.14;b.vx*=.985;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;
      ctx.save();ctx.globalAlpha=Math.max(0,1-age/900);ctx.translate(b.x,b.y);ctx.rotate(b.r);ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.strokeStyle='rgba(42,33,24,.35)';ctx.lineWidth=.8;ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h);ctx.restore();}
    if(trail.length||bits.length)fxRaf=requestAnimationFrame(fx);
  }
  function kickFx(){if(!fxRaf)fxRaf=requestAnimationFrame(fx);}
  addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;confetti(e.clientX,e.clientY,9,3.4);},{passive:true});
  if(!FINE)return;
  const sc=$('#sc'),body=document.body;
  let mx=-200,my=-200,px=-200,py=-200,vx=0,vy=0,ang=-145,tAng=-145,open=10,tOpen=10;
  let on=false,down=false,hover=false,lastMove=0,raf=0,lastTrail=0;
  const rad=Math.PI/180;
  function loop(now){
    raf=0;
    const dx=mx-px,dy=my-py;px=mx;py=my;
    vx+=(dx-vx)*.35;vy+=(dy-vy)*.35;
    const sp=Math.hypot(vx,vy),idle=now-lastMove;
    if(sp>2.2)tAng=Math.atan2(vy,vx)/rad;else if(idle>1600)tAng=-145;
    let d=((tAng-ang+540)%360)-180;ang+=d*.2;
    if(down)tOpen=0.6;
    else if(sp>1.2)tOpen=6+Math.min(sp*1.2,20)*(.55+.45*Math.sin(now/52));
    else tOpen=hover?20+3*Math.sin(now/180):10;
    open+=(tOpen-open)*(down?.6:.32);
    sc.style.transform=`translate3d(${mx}px,${my}px,0) rotate(${ang.toFixed(1)}deg) scale(1.35) translate(-62px,-32px)`;
    sc.style.setProperty('--o',open.toFixed(1));
    if(sp>1&&!down&&now-lastTrail>14){trail.push({x:mx,y:my,t:now});lastTrail=now;if(trail.length>60)trail.shift();kickFx();}
    if(on&&(idle<2200||Math.abs(open-tOpen)>.3||Math.abs(d)>.5||hover))raf=requestAnimationFrame(loop);
  }
  const wake=()=>{if(!raf)raf=requestAnimationFrame(loop);};
  addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse')return;
    mx=e.clientX;my=e.clientY;lastMove=performance.now();
    if(!on){on=true;px=mx;py=my;body.classList.add('sc-on');}
    const t=e.target instanceof Element?e.target:null;
    body.classList.toggle('sc-native',!!(t&&t.closest('input,textarea')));
    hover=!!(t&&t.closest('.sheet,.back,.stamp,.count,.brand'));
    wake();
  },{passive:true});
  addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;down=true;confetti(e.clientX,e.clientY,14,4.2);wake();});
  addEventListener('pointerup',()=>{down=false;wake();});
  document.documentElement.addEventListener('pointerleave',()=>{on=false;body.classList.remove('sc-on');});
  addEventListener('blur',()=>{down=false;});
})();
</script>
<script type="module">
import { GROUPS } from './groups-01.js';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const fa=n=>Number(n).toLocaleString('fa-IR');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v).normalize('NFC').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/\u200c/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').toLocaleLowerCase('fa-IR').trim();
const collator=new Intl.Collator('fa',{sensitivity:'base',ignorePunctuation:true});
const SORTED=GROUPS.map(g=>[...g.students].sort(collator.compare));

function filterGroups(q){
  const n=norm(q),out=[];
  GROUPS.forEach((g,i)=>{
    const all=SORTED[i];
    if(!n){out.push({g,i,students:all,taHit:false});return;}
    const taHit=g.tas.some(t=>norm(t).includes(n));
    const found=all.filter(s=>norm(s).includes(n));
    if(taHit||found.length)out.push({g,i,students:taHit?all:found,taHit});
  });
  return out;
}
function hl(t,q){
  const s=(q||'').trim();
  if(!s)return esc(t);
  const i=t.toLowerCase().indexOf(s.toLowerCase());
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+s.length))+'</mark>'+esc(t.slice(i+s.length));
}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.06,rootMargin:'0px 0px -3% 0px'}):null;
function reveal(root=document){$$('[data-rv]:not(.in)',root).forEach(el=>{if(!io||RM)el.classList.add('in');else io.observe(el);});}
function mount(render){
  const input=$('#q'),count=$('#count'),empty=$('#empty');
  let q='',first=true;
  const ctl={
    get q(){return q.trim();},
    run(){
      const res=filterGroups(q);
      const n=res.reduce((a,r)=>a+r.students.length,0);
      if(count){
        count.textContent=q.trim()?`${fa(n)} نتیجه در ${fa(res.length)} گروه`:`${fa(GROUPS.length)} گروه`;
        if(!first){count.classList.remove('bump');void count.offsetWidth;count.classList.add('bump');}
      }
      first=false;
      if(empty)empty.hidden=res.length>0;
      render(res,q.trim(),ctl);
    },
    clear(){q='';if(input)input.value='';ctl.run();}
  };
  if(input){
    input.addEventListener('input',()=>{q=input.value;ctl.run();});
    input.addEventListener('keydown',e=>{if(e.key==='Escape'&&input.value){e.preventDefault();ctl.clear();}});
  }
  document.addEventListener('keydown',e=>{
    if(e.key==='/'&&input&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();input.focus();}
  });
  ctl.run();
  return ctl;
}
const TILT=[-1.4,1,-.5,1.5,-1,.6];
const CLIP='<svg class="clip" viewBox="0 0 28 64" aria-hidden="true"><path d="M8 48V16a6 6 0 0 1 12 0v32a10 10 0 0 1-20 0V12a14 14 0 0 1 28 0v34" fill="none" stroke="#8a8f96" stroke-width="2.6" stroke-linecap="round"/></svg>';
const board=$('#groups');
mount((res,q)=>{
  board.innerHTML=res.map(({g,i,students},k)=>`<article class="sheet g${i%6}" data-rv style="--r:${TILT[i%6]}deg;--d:${Math.min(k,5)*.07}s"><i class="tape"></i>${CLIP}<div class="paper"><div class="head"><span class="no" aria-hidden="true">${fa(i+1)}</span><h2>${esc(g.title)}</h2></div><div class="tas"><span class="lbl">دستیاران آموزشی</span>${g.tas.map((t,j)=>`<span class="stamp ${j?'b':'a'}">${hl(t,q)}</span>`).join('')}</div><p class="cnt">${fa(students.length)} دانشجو</p><ol>${students.map(s=>`<li>${hl(s,q)}</li>`).join('')}</ol></div></article>`).join('');
  reveal(board);
});
</script>
