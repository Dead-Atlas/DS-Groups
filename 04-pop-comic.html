  .sb-thumb::before{content:"!";position:absolute;inset:0;display:grid;place-items:center;font:400 20px/1 'Lalezar',sans-serif;color:var(--ink);mix-blend-mode:difference;filter:invert(1)}
  .sb.drag .sb-thumb{box-shadow:1px 1px 0 var(--ink)}
  .sb-tip{position:absolute;left:40px;top:0;transform:translateY(calc(var(--ty,0px) + var(--th,80px)/2 - 50%));background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font:400 18px/1.4 'Lalezar',sans-serif;padding:0 14px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .15s}
  .sb:hover .sb-tip,.sb.drag .sb-tip{opacity:1}
  body.cp-on,body.cp-on *{cursor:none!important}
  body.cp-on.cp-native,body.cp-on.cp-native *{cursor:text!important}
  .cp{display:block;position:fixed;left:-19px;top:-19px;width:38px;height:38px;z-index:100001;pointer-events:none;opacity:0;transition:opacity .15s;will-change:transform;filter:drop-shadow(3px 3px 0 rgba(17,17,17,.55))}
  body.cp-on .cp{opacity:1}
  body.cp-on.cp-native .cp{opacity:0}
  .cp svg{display:block;width:100%;height:100%}
  .cp polygon{fill:var(--cf,#f6c800);transition:fill .15s}
  .pow{display:grid;place-items:center;position:fixed;z-index:100000;pointer-events:none;width:160px;height:160px;margin:-80px 0 0 -80px;animation:pow .8s cubic-bezier(.2,1.4,.4,1) forwards}
  .pow svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(5px 5px 0 var(--ink))}
  .pow b{position:relative;font:400 38px/1 'Colak','Lalezar',sans-serif;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
  @keyframes pow{0%{transform:scale(.2) rotate(-14deg);opacity:0}22%{opacity:1;transform:scale(1.15) rotate(5deg)}65%{opacity:1;transform:scale(1) rotate(-3deg)}100%{opacity:0;transform:translateY(-16px) scale(.9) rotate(0)}}
}

@media(max-width:1100px){.page{gap:52px 30px}}
@media(max-width:900px){
  .page{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel{grid-column:span 1!important}
  .panel:last-child:nth-child(odd){grid-column:span 2!important}
  .hb{max-width:46vw;padding:10px 16px 12px}.hb1{top:3%}.hb2{bottom:2%}

  .hand button{pointer-events:auto;position:relative;width:48px;height:70px;margin-inline:-6px;padding:0;border:0;border-radius:0;background:var(--img) center/contain no-repeat;box-shadow:none;filter:drop-shadow(2px 2px 0 var(--ink));rotate:var(--a,0deg);translate:0 12px;transition:translate .25s cubic-bezier(.2,1.7,.4,1)}
  .hand button span{position:absolute;bottom:-4px;inset-inline:0;margin:auto;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ink);font:400 14px/1 'Lalezar',sans-serif;color:var(--ink)}

}
@media(max-width:420px){.balloon input{font-size:17px}.back{padding:0 10px;font-size:15px}.strip b{font-size:18px}.strip b img{width:30px;height:30px}}
@media(prefers-reduced-motion:reduce){.fl{animation:none;transition:none}.logo,.hb,.sfx,.box,.sticker,.tagline,.rays,.ucard,.stw,.tag.bump,.panel[data-rv].in{animation:none}.panel[data-rv]{opacity:1}.px{transition:none}html{scroll-behavior:auto}}

<section class="cover" id="cover" aria-labelledby="t">
  <div class="rays" aria-hidden="true"></div>
  <div class="zoom" aria-hidden="true"></div>
  <div class="px stw st1" aria-hidden="true"><i class="star"></i></div>
  <div class="px stw st2" aria-hidden="true"><i class="star"></i></div>
  <div class="px ucard c1" aria-hidden="true"><span class="fl"><img src="assets/blue-7.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"><img class="bk" src="assets/card-back.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"></span></div>
  <div class="px ucard c2" aria-hidden="true"><span class="fl"><img src="assets/green-7.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"><img class="bk" src="assets/card-back.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"></span></div>
  <div class="px ucard c3" aria-hidden="true"><span class="fl"><img src="assets/red-draw2.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"><img class="bk" src="assets/card-back.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"></span></div>
  <div class="px ucard c4" aria-hidden="true"><span class="fl"><img src="assets/wild.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"><img class="bk" src="assets/card-back.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"></span></div>
  <div class="px ucard c5" aria-hidden="true"><span class="fl"><img src="assets/yellow-reverse.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"><img class="bk" src="assets/card-back.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"></span></div>
  <div class="px ucard c6" aria-hidden="true"><span class="fl"><img src="assets/red-skip.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"><img class="bk" src="assets/card-back.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"></span></div>
  <div class="px ucard c7" aria-hidden="true"><span class="fl"><img src="assets/blue-reverse.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"><img class="bk" src="assets/card-back.png" alt="" width="300" height="440" onerror="this.style.visibility='hidden'"></span></div>
  <div class="logo"><h1 id="t">ساختمان<br>داده‌ها</h1><div class="sticker" aria-hidden="true"><span>UNO!</span></div></div>
  <div class="px hb1" aria-hidden="true"><div class="hb">پروژه اول: بازی UNO<br><b>دکتر افسانه فاطمی</b></div></div>
  <div class="px hb2" aria-hidden="true"><div class="hb">گروه خودت رو پیدا کن!</div></div>
  <div class="px sfx s1" aria-hidden="true"><span>بوم!</span></div>

<main class="page" id="groups"></main>
<p class="empty" id="empty" role="status" hidden><img src="assets/red-draw2.png" alt="" width="300" height="440" onerror="this.remove()">هیچی پیدا نشد! +۲ بکش و یه اسم دیگه امتحان کن.</p>
<footer class="foot"><span>Designed by ATLAS</span></footer>

<nav class="hand" id="hand" aria-label="پرش به گروه"></nav>
<div class="sb" id="sb" aria-hidden="true"><div class="sb-line"></div><div class="sb-thumb" id="sbThumb"></div><div class="sb-tip" id="sbTip"></div></div>
<div class="cp" id="cp" aria-hidden="true"><svg viewBox="-50 -50 100 100"><polygon id="cpS" stroke="#111" stroke-width="9" stroke-linejoin="round" points=""/><circle r="10" fill="#111"/></svg></div>

<script>
(()=>{
  const $=s=>document.querySelector(s),root=document.documentElement;
  const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
  const fa=n=>Number(n).toLocaleString('fa-IR');
  const star=(n,R,r)=>{const p=[];for(let k=0;k<n*2;k++){const a=Math.PI*k/n,rad=k%2?r:R;p.push((Math.sin(a)*rad).toFixed(1)+','+(-Math.cos(a)*rad).toFixed(1));}return p.join(' ');};
  $('#cpS').setAttribute('points',star(9,46,28));

  const cover=$('#cover');
  cover.querySelectorAll('.ucard').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('flipped')));
  if(FINE&&!RM){
    cover.addEventListener('pointermove',e=>{const r=cover.getBoundingClientRect();cover.style.setProperty('--mx',((e.clientX-r.left)/r.width-.5).toFixed(3));cover.style.setProperty('--my',((e.clientY-r.top)/r.height-.5).toFixed(3));},{passive:true});
    cover.addEventListener('pointerleave',()=>{cover.style.setProperty('--mx',0);cover.style.setProperty('--my',0);});
  }

  if(FINE){
    const sb=$('#sb'),thumb=$('#sbThumb'),tip=$('#sbTip');
    root.classList.add('js-sb');
    let docH=1,vh=1,trackH=1,th=64,raf=0,dragging=false,y0=0,s0=0;
    function measure(){vh=innerHeight;docH=Math.max(root.scrollHeight,vh+1);trackH=sb.clientHeight||1;th=Math.max(64,Math.min(trackH,trackH*vh/docH));sb.style.setProperty('--th',th.toFixed(1)+'px');}
    function paint(){
      raf=0;const max=Math.max(1,docH-vh),p=Math.min(1,Math.max(0,scrollY/max)),ty=p*(trackH-th);
      sb.style.setProperty('--ty',ty.toFixed(1)+'px');tip.textContent=fa(Math.round(p*100))+'٪';
      const el=document.elementFromPoint(innerWidth/2,innerHeight/2),pn=el&&el.closest&&el.closest('.panel');
      sb.style.setProperty('--tc',pn?getComputedStyle(pn).getPropertyValue('--cap').trim()||'#f6c800':'#f6c800');
    }
    const req=()=>{if(!raf)raf=requestAnimationFrame(paint);};
    addEventListener('scroll',req,{passive:true});
    addEventListener('resize',()=>{measure();req();});
    if('ResizeObserver' in window)new ResizeObserver(()=>{measure();req();}).observe(document.body);
    measure();paint();
    thumb.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();dragging=true;y0=e.clientY;s0=scrollY;thumb.setPointerCapture(e.pointerId);sb.classList.add('drag');});
    thumb.addEventListener('pointermove',e=>{if(!dragging)return;const k=(docH-vh)/Math.max(1,trackH-th);scrollTo({top:s0+(e.clientY-y0)*k,behavior:'instant'});});
    const end=()=>{dragging=false;sb.classList.remove('drag');};
    thumb.addEventListener('pointerup',end);thumb.addEventListener('pointercancel',end);
    sb.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.sb-thumb'))return;const r=sb.getBoundingClientRect(),p=(e.clientY-r.top-th/2)/Math.max(1,trackH-th);scrollTo({top:Math.max(0,Math.min(1,p))*(docH-vh),behavior:RM?'instant':'smooth'});});
  }

  if(RM||!FINE)return;

  const WORDS=['اونو!','بوم!','+۴','پاو!','زپ!','رنگ!'],POWC=['#e5252a','#0b6fc2','#0a9a4a','#d94e9a','#ff8a00'];
  let powCount=0;
  function pow(x,y){
    if(powCount>5)return;powCount++;
    const el=document.createElement('div');el.className='pow';el.style.left=x+'px';el.style.top=y+'px';
    const c=POWC[(Math.random()*POWC.length)|0];
    el.innerHTML=`<svg viewBox="-110 -110 220 220"><polygon points="${star(12,104,70)}" fill="${c}" stroke="#111" stroke-width="6" stroke-linejoin="round"/></svg><b>${WORDS[(Math.random()*WORDS.length)|0]}</b>`;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>{el.remove();powCount--;},{once:true});
  }

  const cp=$('#cp'),body=document.body;
  let mx=-100,my=-100,vx=0,sc=1,rot=0,scT=1,rotT=0,on=false,loop=0,hot=false;
  const HOT='a,button,.say,li,.tag,.balloon,.sb,.nar';
  function frame(){
    loop=0;
    vx*=.8;const wob=Math.max(-26,Math.min(26,vx*1.5));
    sc+=(scT-sc)*.28;rot+=((rotT+wob)-rot)*.28;
    cp.style.transform=`translate3d(${mx}px,${my}px,0) rotate(${rot.toFixed(1)}deg) scale(${sc.toFixed(3)})`;
    if(on&&(Math.abs(scT-sc)>.01||Math.abs(rotT+wob-rot)>.3||Math.abs(vx)>.2))loop=requestAnimationFrame(frame);
  }
  const wake=()=>{if(!loop)loop=requestAnimationFrame(frame);};
  addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse')return;
    vx+=(e.clientX-mx)*.25;mx=e.clientX;my=e.clientY;
    if(!on){on=true;body.classList.add('cp-on');}
    const t=e.target instanceof Element?e.target:null;
    body.classList.toggle('cp-native',!!(t&&t.closest('input,textarea')));
    const h=!!(t&&t.closest(HOT));
    if(h!==hot){hot=h;cp.style.setProperty('--cf',h?'#e5252a':'#f6c800');scT=h?1.4:1;rotT=h?14:0;}
    wake();
  },{passive:true});
  addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;scT=.65;rotT=-16;wake();pow(e.clientX,e.clientY);});
  addEventListener('pointerup',()=>{scT=hot?1.4:1;rotT=hot?14:0;wake();});
  document.documentElement.addEventListener('pointerleave',()=>{on=false;body.classList.remove('cp-on');});
})();
</script>

<script type="module">
import { GROUPS } from './groups-04.js';

const $=(s,r=document)=>r.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const fa=n=>Number(n).toLocaleString('fa-IR');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v).normalize('NFC').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/\u200c/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').toLocaleLowerCase('fa-IR').trim();
const collator=new Intl.Collator('fa',{sensitivity:'base',ignorePunctuation:true});
const SORTED=GROUPS.map(g=>[...g.students].sort(collator.compare));

function filterGroups(q){
  const n=norm(q),out=[];
  GROUPS.forEach((g,i)=>{
    const all=SORTED[i];
    if(!n){out.push({g,i,students:all});return;}
    const taHit=g.tas.some(t=>norm(t).includes(n));
    const found=all.filter(s=>norm(s).includes(n));
    if(taHit||found.length)out.push({g,i,students:taHit?all:found});
  });
  return out;
}
function hl(t,q){
  const s=(q||'').trim();
  if(!s)return esc(t);
  const i=t.toLowerCase().indexOf(s.toLowerCase());
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+s.length))+'</mark>'+esc(t.slice(i+s.length));
}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.04,rootMargin:'0px 0px -3% 0px'}):null;
function reveal(root){root.querySelectorAll('[data-rv]:not(.in)').forEach(el=>{if(!io||RM)el.classList.add('in');else io.observe(el);});}

function spans(n){
  const rows=[[4,2],[2,4],[3,3]],out=[];let r=0;
  while(out.length<n){const left=n-out.length,row=rows[r%3];
    if(left===1)out.push(6);else out.push(row[0],row[1]);
    r++;}
  return out.slice(0,n);
}
const FX=['اونو!','+۲','+۴','رنگ!','بپر!','بوم!'];
const CARD=['#0b6fc2','#e5252a','#f6c800','#0a9a4a','#d94e9a','#1b1b1b'];
const TILT=[-.9,.8,-.5,.9,-.7,.6];
const FACE=['blue-7','red-7','yellow-7','green-7','wild','card-back'];
function mascot(i){
  return `<img class="mas" src="assets/${FACE[i%6]}.png" alt="" width="300" height="440" loading="lazy" onerror="this.style.visibility='hidden'">`;
}
const board=$('#groups'),hand=$('#hand');
let spy=null;
function watch(){
  if(spy)spy.disconnect();
  if(!('IntersectionObserver' in window))return;
  spy=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;hand.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.g===e.target.id.slice(1))));}),{rootMargin:'-45% 0px -50% 0px'});
  board.querySelectorAll('.panel').forEach(p=>spy.observe(p));
}
function render(res,q){
  const sp=spans(res.length);
  board.innerHTML=res.map(({g,i,students},k)=>`<article class="panel g${i%6} v${i%6}" id="g${i}" data-rv style="grid-column:span ${sp[k]};--rot:${TILT[i%6]}deg;--d:${Math.min(k,5)*.08}s"><div class="pf"><div class="pb"><div class="tas">${g.tas.map((t,j)=>`<div class="say ${j?'b':'a'}"><small>دستیار آموزشی</small>${hl(t,q)}<i></i></div>`).join('')}</div><span class="cnt">${fa(students.length)} دانشجو</span><ol>${students.map(s=>`<li>${hl(s,q)}</li>`).join('')}</ol></div></div><header class="nar"><span class="pn" aria-hidden="true">${fa(i+1)}</span><h2>${esc(g.title)}</h2></header><span class="pfx" aria-hidden="true">${FX[i%6]}</span>${mascot(i)}</article>`).join('');
  hand.innerHTML=res.map(({i},k)=>`<button type="button" data-g="${i}" style="--img:url(assets/${FACE[i%6]}.png);--a:${((k-(res.length-1)/2)*8).toFixed(1)}deg" aria-label="${esc(GROUPS[i].title)}" aria-current="false"><span>${fa(i+1)}</span></button>`).join('');
  reveal(board);
  watch();
}
function absTop(el){let y=0;while(el){y+=el.offsetTop;el=el.offsetParent;}return y;}
hand.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const el=document.getElementById('g'+b.dataset.g);if(el)scrollTo({top:absTop(el)-30,behavior:RM?'auto':'smooth'});});

const input=$('#q'),count=$('#count'),empty=$('#empty');
let first=true;
function update(){
  const q=input.value.trim(),res=filterGroups(q);
  const n=res.reduce((a,r)=>a+r.students.length,0);
  count.textContent=q?`${fa(n)} نتیجه در ${fa(res.length)} گروه`:`${fa(GROUPS.length)} گروه`;
  if(!first){count.classList.remove('bump');void count.offsetWidth;count.classList.add('bump');}
  first=false;
  empty.hidden=res.length>0;
  render(res,q);
}
input.addEventListener('input',update);
input.addEventListener('keydown',e=>{if(e.key==='Escape'&&input.value){e.preventDefault();input.value='';update();}});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==input&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();input.focus();}
});
update();
</script>
